name: guardian_app
description: "App Guardian SekolahPro: A application for managing and monitoring student"
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0
  shared_preferences: ^2.2.3
  package_info_plus: ^8.3.0
  logger: ^2.6.0
  lottie: ^3.2.0
  flutter_svg: ^2.0.9
  flutter_svg_provider: ^1.0.7
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  flutter_dotenv: ^5.2.1
  permission_handler: ^11.4.0
  provider: ^6.1.2
  http: ^1.5.0
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/config.json
    - .env
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/UrbanistRomanBold.ttf
          weight: 700
        - asset: assets/fonts/UrbanistRomanRegular.ttf
          weight: 400
        - asset: assets/fonts/UrbanistSemiBold.ttf
          weight: 600
    - family: Lato
      fonts:
        - asset: assets/fonts/LatoRegular.ttf
          weight: 400
        - asset: assets/fonts/LatoBold.ttf
          weight: 700
        - asset: assets/fonts/LatoSemiBold.ttf
          weight: 600

